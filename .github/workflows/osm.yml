name: Fetch OSM river data

# Handvirkt keyrt. Overpass næst ekki úr þróunarumhverfinu, en hlauparar
# GitHub hafa opna nettengingu — hrágögnin eru sótt hér og lögð í greinina.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch-osm.mjs'
      - '.github/workflows/osm.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node tools/fetch-osm.mjs

      - name: Commit raw data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/data
          git diff --cached --quiet && echo "engin breyting" && exit 0
          git commit -m "Fetch raw OSM data for Laxá í Aðaldal"
          git push origin HEAD:${{ github.ref_name }}

name: Fetch OSM river data

# Handvirkt keyrt. Overpass næst ekki úr þróunarumhverfinu, en hlauparar
# GitHub hafa opna nettengingu — hrágögnin eru sótt hér og lögð í greinina.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch-osm.mjs'
      - '.github/workflows/osm.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node tools/fetch-osm.mjs

      # Fyrirspurnirnar taka drjúgar mínútur. Skráðar sem hlutur líka, svo
      # gögnin séu til taks þótt ýtingin hér á eftir mistakist.
      - uses: actions/upload-artifact@v4
        with:
          name: osm-data
          path: tools/data

      - name: Commit raw data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/data
          if git diff --cached --quiet; then
            echo "engin breyting"
            exit 0
          fi
          git commit -m "Fetch raw OSM data for Laxá í Aðaldal"
          # Greinin gæti hafa færst á meðan sótt var.
          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && \
              git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((attempt * 5))
          done
          exit 1

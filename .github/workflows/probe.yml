name: Probe network

# Til bráðabirgða: kannar hvað hlauparinn nær í. Eytt aftur þegar svarið liggur fyrir.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/probe-net.mjs'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/probe-net.mjs
